<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Exodra + OIMDB + CNStra • TodoMVC</title>
        <style>
            :root {
                --accent: #b83f45;
                --ink: #1f2328;
                --muted: #8b8f96;
                --line: #ececec;
                --paper: #fff;
                --ground: #f4f2ef;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 56px 16px;
                background: var(--ground);
                color: var(--ink);
                font: 16px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .todoapp {
                max-width: 560px;
                margin: 0 auto;
                background: var(--paper);
                border-radius: 14px;
                box-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.06),
                    0 12px 32px rgba(0, 0, 0, 0.08);
                overflow: hidden;
            }
            h1 {
                margin: 0;
                padding: 28px 24px 8px;
                font-weight: 200;
                font-size: 56px;
                letter-spacing: -0.02em;
                text-align: center;
                color: var(--accent);
            }
            .new-todo,
            .edit {
                width: 100%;
                font: inherit;
                color: inherit;
                border: 0;
                outline: none;
            }
            .new-todo {
                padding: 18px 24px;
                font-size: 18px;
                border-bottom: 1px solid var(--line);
            }
            .new-todo::placeholder {
                color: #b5b8bd;
                font-style: italic;
            }
            .main {
                position: relative;
            }
            .toggle-all {
                position: absolute;
                opacity: 0;
                pointer-events: none;
            }
            .toggle-all + label {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 24px;
                font-size: 13px;
                color: var(--muted);
                border-bottom: 1px solid var(--line);
                cursor: pointer;
                user-select: none;
            }
            .toggle-all + label::before {
                content: '';
                width: 14px;
                height: 14px;
                border: 1.5px solid #c9ccd1;
                border-radius: 4px;
            }
            .toggle-all:checked + label {
                color: var(--ink);
            }
            .toggle-all:checked + label::before {
                background: var(--accent);
                border-color: var(--accent);
            }
            .todo-list {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .todo-list li {
                border-bottom: 1px solid var(--line);
            }
            .view {
                display: flex;
                align-items: center;
                gap: 14px;
                padding: 14px 24px;
            }
            .toggle {
                appearance: none;
                flex: none;
                width: 22px;
                height: 22px;
                margin: 0;
                border: 1.5px solid #c9ccd1;
                border-radius: 50%;
                cursor: pointer;
                transition:
                    background 120ms,
                    border-color 120ms;
            }
            .toggle:checked {
                border-color: #5dc2af;
                background: #5dc2af
                    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M4 8.5l2.5 2.5L12 5.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>')
                    center / 14px no-repeat;
            }
            .view label {
                flex: 1;
                word-break: break-word;
                cursor: text;
                transition: color 120ms;
            }
            .completed label {
                color: var(--muted);
                text-decoration: line-through;
            }
            .destroy {
                flex: none;
                width: 28px;
                height: 28px;
                border: 0;
                border-radius: 6px;
                background: none;
                color: var(--muted);
                font-size: 20px;
                line-height: 1;
                cursor: pointer;
                opacity: 0;
                transition:
                    opacity 120ms,
                    color 120ms,
                    background 120ms;
            }
            .destroy::after {
                content: '×';
            }
            .view:hover .destroy,
            .destroy:focus-visible {
                opacity: 1;
            }
            .destroy:hover {
                color: var(--accent);
                background: #fbeeee;
            }
            .edit {
                display: none;
                padding: 13px 24px 13px 60px;
                box-shadow: inset 0 0 0 2px var(--accent);
            }
            .editing .view {
                display: none;
            }
            .editing .edit {
                display: block;
            }
            .empty {
                margin: 0;
                padding: 28px 24px;
                text-align: center;
                color: var(--muted);
                font-size: 14px;
            }
            .footer {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 8px;
                padding: 12px 24px;
                font-size: 13px;
                color: var(--muted);
            }
            .footer[hidden],
            .main[hidden],
            .empty[hidden] {
                display: none;
            }
            .todo-count strong {
                color: var(--ink);
                font-weight: 600;
            }
            .filters {
                display: flex;
                gap: 4px;
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .filters a {
                display: block;
                padding: 3px 10px;
                border-radius: 999px;
                color: inherit;
                text-decoration: none;
                transition:
                    background 120ms,
                    color 120ms;
            }
            .filters a:hover {
                color: var(--ink);
            }
            .filters a.selected {
                background: #fbeeee;
                color: var(--accent);
            }
            .clear-completed {
                justify-self: end;
                padding: 3px 0;
                border: 0;
                background: none;
                color: inherit;
                font: inherit;
                cursor: pointer;
            }
            .clear-completed:hover {
                color: var(--accent);
            }
            .clear-completed[hidden] {
                display: block;
                visibility: hidden;
            }
            .credits {
                margin: 24px auto 0;
                max-width: 560px;
                text-align: center;
                font-size: 12px;
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <p class="credits">
            Double-click a todo to edit it · Exodra renders, OIMDB stores, CNStra reacts
        </p>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
