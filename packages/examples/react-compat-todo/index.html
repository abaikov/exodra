<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>React on Exodra • TodoMVC</title>
        <style>
            body {
                margin: 0;
                padding: 32px 16px;
                background: #f5f5f5;
                color: #111;
                font: 16px/1.4 system-ui, sans-serif;
            }
            .todoapp {
                max-width: 560px;
                margin: 0 auto;
                background: #fff;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            }
            h1 {
                margin: 0;
                padding: 16px;
                font-weight: 300;
                font-size: 48px;
                text-align: center;
                color: #b83f45;
            }
            .new-todo,
            .edit {
                box-sizing: border-box;
                width: 100%;
                padding: 14px 16px;
                font: inherit;
                border: 0;
                border-bottom: 1px solid #ddd;
            }
            .todo-list {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .todo-list li {
                border-bottom: 1px solid #eee;
            }
            .view {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 16px;
            }
            .view label {
                flex: 1;
                cursor: text;
            }
            .completed label {
                color: #999;
                text-decoration: line-through;
            }
            .destroy {
                border: 0;
                background: none;
                color: #b83f45;
                font-size: 20px;
                cursor: pointer;
                visibility: hidden;
            }
            .destroy::after {
                content: '×';
            }
            .view:hover .destroy {
                visibility: visible;
            }
            .edit {
                display: none;
            }
            .editing .view {
                display: none;
            }
            .editing .edit {
                display: block;
            }
            .footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 10px 16px;
                font-size: 14px;
                color: #555;
            }
            .footer[hidden],
            .main[hidden],
            .clear-completed[hidden] {
                display: none;
            }
            .filters {
                display: flex;
                gap: 6px;
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .filters a {
                padding: 2px 6px;
                border: 1px solid transparent;
                border-radius: 3px;
                color: inherit;
                text-decoration: none;
            }
            .filters a.selected {
                border-color: #ce4646;
            }
            .clear-completed {
                border: 0;
                background: none;
                color: inherit;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="./src/main.jsx"></script>
    </body>
</html>
