[package]
name = "swc-plugin-exodra"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
swc_core = { version = "74", features = [
    "ecma_plugin_transform",
    "ecma_ast",
    "ecma_visit",
    "ecma_utils",
] }
# The host hands a plugin its config as a JSON STRING, so reading `mode` /
# `schemaSource` / `markerName` needs a parser. Already in the lock file as one of
# swc_core's own dependencies, so this adds an edge and not a crate.
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
