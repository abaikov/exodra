# npm minor and patch updates arrive in one weekly PR; every major arrives as its own PR, so one
# migration never blocks the rest. GitHub Actions updates arrive in one monthly PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Framework peers used only for comparison in the benchmark suite; bumping
      # them changes benchmark numbers rather than fixing anything.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: solid-js
      - dependency-name: svelte
      - dependency-name: voby

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
