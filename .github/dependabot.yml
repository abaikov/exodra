# One weekly PR of npm minor and patch updates and one monthly PR of GitHub Actions updates. Majors
# are migrations done by hand: as separate PRs they all rewrite package-lock.json and conflict.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Framework peers used only for comparison in the benchmark suite; bumping
      # them changes benchmark numbers rather than fixing anything.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: solid-js
      - dependency-name: svelte
      - dependency-name: voby

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
