# One pull request per ecosystem: every npm update in one weekly PR, every GitHub Actions update
# in one monthly PR. CI verifies the PR like any other change, so a bump that breaks the build is
# caught before it is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Framework peers used only for comparison in the benchmark suite; bumping
      # them changes benchmark numbers rather than fixing anything.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: solid-js
      - dependency-name: svelte
      - dependency-name: voby

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
