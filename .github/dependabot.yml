# Dependency updates arrive as PRs, which CI verifies like any other change —
# so a bump that breaks the build is caught before it is merged, not after.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the noisy dev tooling instead of a dozen.
      dev-tooling:
        patterns: ['@types/*', 'eslint*', 'prettier', 'typescript', 'vitest', '@vitest/*', 'tsup']
        update-types: [minor, patch]
      dev-tooling-major:
        patterns: ['@types/*', 'eslint*', 'prettier', 'typescript', 'vitest', '@vitest/*', 'tsup']
        update-types: [major]
    ignore:
      # Framework peers used only for comparison in the benchmark suite; bumping
      # them changes benchmark numbers rather than fixing anything.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: solid-js
      - dependency-name: svelte
      - dependency-name: voby

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
