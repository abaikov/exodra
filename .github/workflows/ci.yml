name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here publishes or writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The runner ships rustup and a stable toolchain but not this target, and
      # `build:wasm` hard-exits without it — so the gate below cannot pass unless
      # this runs first.
      - name: Rust wasm target (for build:wasm)
        run: rustup target add wasm32-wasip1

      - name: release:check
        run: npm run release:check

      # Installs the built tarballs into a throwaway project and renders with
      # them — catches a broken `files`/`exports`/peer range that the in-repo
      # test run cannot see.
      - name: Packed-artifact integration
        run: npm run test:packed

  docs-site:
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
        working-directory: docs-site

      - run: npm run build
        working-directory: docs-site
