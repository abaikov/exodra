name: Release

# ⚠️  THIS PUBLISHES TO npm ON AN ORDINARY PUSH TO master/main. Nobody runs a command and nobody
#     is asked; merging a changeset IS the release. A publish does not come back — unpublish is a
#     72-hour window and a used version number is refused for ever.
#
# THE TWO `if:` CONDITIONS BELOW ARE THE WHOLE MECHANISM, and `inputs` is empty on every event but
# workflow_dispatch, so an unset `dry_run` reads as FALSE:
#
#   push to master/main     dry run skipped, publish runs        → PUBLISHES
#   push of a v* tag        identical; `tags:` does not narrow `branches:`
#                           — under `push` they are alternatives → PUBLISHES
#   workflow_dispatch       `dry_run` defaults to true           → packs only
#   dispatch, dry_run:false                                      → PUBLISHES
#
# The only thing between a push and the registry is the `npm-publish` environment on the job below.
# AN ENVIRONMENT WITH NO PROTECTION RULES IS A LABEL, NOT A GATE — a required reviewer is set in
# repository settings and cannot be seen from this file.
#
# Why the shape, and why publishing happens here rather than from a laptop (provenance needs an
# OIDC token, which exists in Actions): docs-site/docs/architecture/gates-and-root-configs.md

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack, but do not publish'
        type: boolean
        default: true

permissions:
  # `contents: write` so the version bump and changelogs can be pushed back.
  contents: write
  # Mints the OIDC token npm signs the provenance with.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets compares against the base branch, so it needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Makes npm write an authenticated .npmrc from NODE_AUTH_TOKEN.
          registry-url: https://registry.npmjs.org

      # A RELEASE ONLY, and it is not optional: `swc_plugin_exodra.wasm` is gitignored and is the
      # whole of `swc-plugin-exodra`'s `files`, and `scripts/publish.sh` refuses to publish ANY
      # package when a promised file is missing — so a release from a clean checkout without this
      # dies before publishing even the packages that never heard of the plugin.
      # Why `build:wasm` is in `release:check` and not `build:all`:
      # docs-site/docs/architecture/gates-and-root-configs.md
      - name: Rust toolchain for the SWC plugin
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - run: npm ci

      # THIS STEP IS THE SWITCH, and nothing here stops a push that carries no changeset: versions
      # stay put, publish.sh finds them all already published and its "nothing was published"
      # branch exits 1, so the run goes red rather than shipping. A push WITH one bumps, cascades
      # to dependents, rewrites internal ranges — and goes all the way, with no second confirmation.
      - name: Apply changesets
        id: version
        run: |
          if ls .changeset/*.md >/dev/null 2>&1 && \
             [ "$(ls .changeset/*.md | grep -cv README)" -gt 0 ]; then
            npx changeset version
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets — versions unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The gate runs AFTER versioning, so it validates exactly what ships.
      - name: release:check
        run: npm run release:check

      - name: Packed-artifact integration
        run: npm run test:packed

      # Reached ONLY from workflow_dispatch: on a push `inputs` is empty, so this is false.
      - name: Dry run (pack only, no publish)
        if: inputs.dry_run
        run: npm run publish:dry

      # TRUE ON AN ORDINARY PUSH — `!inputs.dry_run` inverts an unset value; branch and v* tag
      # pushes both land here.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm run publish:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # publish.sh leaves this unset locally; provenance is rejected outside CI.
          NPM_CONFIG_PROVENANCE: 'true'

      # Last, so a failed publish leaves no version claiming to be released. IT WORKS ONLY ON A
      # BRANCH PUSH: `checkout` of a v* tag leaves a detached HEAD, so there `git push` has no
      # upstream and fails AFTER the packages are on the registry, leaving the bump only on npm.
      # Left alone because fixing it changes behaviour.
      - name: Push version bump
        if: ${{ !inputs.dry_run && steps.version.outputs.changed == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: release [skip ci]" || exit 0
          git push
