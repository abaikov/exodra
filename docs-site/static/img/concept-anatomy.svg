<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-label="Anatomy of an Exodra view: the schema skeleton, reactivity wires, and DOM flesh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="880" height="380" rx="18" fill="url(#bg)"/>

  <!-- zone labels -->
  <text x="140" y="352" fill="#8aa0bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">SCHEMA · skeleton</text>
  <text x="440" y="352" fill="#5fd4c4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">SIGNALS · wires</text>
  <text x="690" y="352" fill="#8aa0bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">DOM · flesh</text>

  <!-- spine -->
  <line x1="140" y1="52" x2="140" y2="312" stroke="#33507a" stroke-width="3" stroke-linecap="round"/>

  <!-- bones (schema nodes) -->
  <g font-family="ui-monospace,monospace" font-size="12" fill="#dbe6f5">
    <rect x="70" y="56" width="140" height="44" rx="9" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.4"/>
    <text x="140" y="83" text-anchor="middle">static</text>
    <circle cx="210" cy="78" r="4.5" fill="#5b6f8c"/>

    <rect x="70" y="128" width="140" height="44" rx="9" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.4"/>
    <text x="140" y="155" text-anchor="middle">bindable</text>
    <circle cx="210" cy="150" r="5.5" fill="#2dd4bf" filter="url(#glow)"/>

    <rect x="70" y="200" width="140" height="44" rx="9" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.4"/>
    <text x="140" y="227" text-anchor="middle">bindableList</text>
    <circle cx="210" cy="222" r="5.5" fill="#2dd4bf" filter="url(#glow)"/>

    <rect x="70" y="272" width="140" height="44" rx="9" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.4"/>
    <text x="140" y="299" text-anchor="middle">static</text>
    <circle cx="210" cy="294" r="4.5" fill="#5b6f8c"/>
  </g>

  <!-- wires: socket -> flesh -->
  <g fill="none" stroke="#2dd4bf" stroke-width="2.2" filter="url(#glow)">
    <path d="M210 150 C 360 150, 430 138, 560 138" opacity="0.95"/>
    <path d="M210 222 C 360 222, 430 250, 560 250" opacity="0.95"/>
  </g>
  <!-- little value pulses on the wires -->
  <circle cx="392" cy="146" r="3.4" fill="#7ff3e4"/>
  <circle cx="392" cy="238" r="3.4" fill="#7ff3e4"/>

  <!-- flesh (DOM panels) -->
  <g>
    <rect x="560" y="104" width="230" height="70" rx="10" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="576" y="120" width="120" height="12" rx="4" fill="#5fd4c4" fill-opacity="0.75"/>
    <rect x="576" y="142" width="198" height="8" rx="4" fill="#9fb3cc" fill-opacity="0.45"/>
    <rect x="576" y="156" width="150" height="8" rx="4" fill="#9fb3cc" fill-opacity="0.45"/>

    <rect x="560" y="200" width="230" height="100" rx="10" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect x="576" y="214" width="198" height="20" rx="5" fill="#9fb3cc" fill-opacity="0.28"/>
    <rect x="576" y="240" width="198" height="20" rx="5" fill="#9fb3cc" fill-opacity="0.28"/>
    <rect x="576" y="266" width="198" height="20" rx="5" fill="#9fb3cc" fill-opacity="0.28"/>
  </g>

  <!-- title -->
  <text x="40" y="34" fill="#eaf1fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">An Exodra view, in three layers</text>
</svg>
