<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Clone-cache: a static subtree marked with a cache key is built once, then cloned for every occurrence and patched at its reactive holes">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <filter id="glow5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="300" rx="18" fill="url(#bg5)"/>
  <text x="40" y="34" fill="#eaf1fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">Build the skeleton once — clone the rest</text>

  <!-- template -->
  <rect x="150" y="86" width="8" height="18" rx="4" fill="#2dd4bf"/>
  <rect x="70" y="104" width="170" height="76" rx="11" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.6"/>
  <rect x="86" y="88" width="70" height="20" rx="10" fill="#102a2a" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="1.2"/>
  <text x="121" y="102" text-anchor="middle" fill="#7ff3e4" font-family="ui-monospace,monospace" font-size="10.5">cache:key</text>
  <text x="155" y="140" text-anchor="middle" fill="#dbe6f5" font-family="ui-monospace,monospace" font-size="12">static template</text>
  <text x="155" y="160" text-anchor="middle" fill="#8aa0bd" font-family="ui-monospace,monospace" font-size="11">built once</text>

  <!-- arrow -->
  <path d="M250 142 L360 142" fill="none" stroke="#c7d6ea" stroke-width="2.4" marker-end="url(#ca)"/>
  <defs><marker id="ca" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#c7d6ea"/></marker></defs>
  <text x="305" y="132" text-anchor="middle" fill="#8aa0bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">cloneNode ×N</text>

  <!-- cloned deck (offset copies) -->
  <g>
    <rect x="470" y="94"  width="180" height="70" rx="11" fill="#152238" stroke="#5b6f8c" stroke-opacity="0.5" stroke-width="1.2"/>
    <rect x="456" y="108" width="180" height="70" rx="11" fill="#17263e" stroke="#7d90ad" stroke-opacity="0.6" stroke-width="1.2"/>
    <rect x="442" y="122" width="180" height="70" rx="11" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.5"/>
    <text x="532" y="150" text-anchor="middle" fill="#dbe6f5" font-family="ui-monospace,monospace" font-size="12">clone</text>
    <!-- patched reactive hole -->
    <circle cx="600" cy="158" r="5" fill="#2dd4bf" filter="url(#glow5)"/>
    <text x="532" y="172" text-anchor="middle" fill="#8aa0bd" font-family="ui-monospace,monospace" font-size="10.5">+ patch the holes</text>
  </g>

  <!-- fan of many -->
  <g fill="none" stroke="#33507a" stroke-width="1.6" opacity="0.8">
    <path d="M636 128 C 700 110, 740 96, 806 92"/>
    <path d="M636 150 C 700 150, 740 150, 806 150"/>
    <path d="M636 172 C 700 190, 740 204, 806 208"/>
  </g>
  <g fill="#1a2a44" stroke="#5b6f8c" stroke-opacity="0.6" stroke-width="1.2">
    <rect x="806" y="78"  width="46" height="28" rx="7"/>
    <rect x="806" y="136" width="46" height="28" rx="7"/>
    <rect x="806" y="194" width="46" height="28" rx="7"/>
  </g>

  <text x="440" y="270" text-anchor="middle" fill="#8aa0bd" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11">One native clone + a couple of patches per row — instead of building every node from scratch.</text>
</svg>
