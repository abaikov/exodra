<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="The five typed prop buckets of an Exodra element: static, bindable, bindableList, handlers, bindableHandlers">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="360" rx="18" fill="url(#bg3)"/>
  <text x="40" y="34" fill="#eaf1fb" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700">Every prop lands in exactly one typed bucket</text>

  <!-- element node -->
  <rect x="48" y="150" width="150" height="60" rx="11" fill="#1a2a44" stroke="#c7d6ea" stroke-width="1.6"/>
  <text x="123" y="178" text-anchor="middle" fill="#dbe6f5" font-family="ui-monospace,monospace" font-size="14">&lt;button&gt;</text>
  <text x="123" y="196" text-anchor="middle" fill="#8aa0bd" font-family="ui-monospace,monospace" font-size="11">an element</text>

  <!-- 5 connectors -->
  <g fill="none" stroke-width="2" filter="url(#glow3)">
    <path d="M198 168 C 260 120, 300 78,  360 78"  stroke="#9fb3cc"/>
    <path d="M198 174 C 260 150, 300 140, 360 140" stroke="#2dd4bf"/>
    <path d="M198 180 L 360 200"                    stroke="#2dd4bf"/>
    <path d="M198 190 C 260 210, 300 262, 360 262" stroke="#f6c177"/>
    <path d="M198 198 C 260 250, 300 324, 360 324" stroke="#f6c177"/>
  </g>

  <!-- 5 buckets -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <g>
      <rect x="360" y="56" width="470" height="44" rx="9" fill="#141f34" stroke="#9fb3cc" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="378" y="76" fill="#dbe6f5" font-family="ui-monospace,monospace" font-size="14" font-weight="700">static</text>
      <text x="378" y="92" fill="#8aa0bd" font-size="11.5">plain DOM attrs · static children · lifecycle hooks — set once, never move</text>
    </g>
    <g>
      <rect x="360" y="118" width="470" height="44" rx="9" fill="#102a2a" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="378" y="138" fill="#7ff3e4" font-family="ui-monospace,monospace" font-size="14" font-weight="700">bindable</text>
      <text x="378" y="154" fill="#8aa0bd" font-size="11.5">reactive scalars — textContent, value, class, an attribute, one child</text>
    </g>
    <g>
      <rect x="360" y="180" width="470" height="44" rx="9" fill="#102a2a" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="378" y="200" fill="#7ff3e4" font-family="ui-monospace,monospace" font-size="14" font-weight="700">bindableList</text>
      <text x="378" y="216" fill="#8aa0bd" font-size="11.5">a reactive list of children — a list() / command source</text>
    </g>
    <g>
      <rect x="360" y="242" width="470" height="44" rx="9" fill="#2a2113" stroke="#f6c177" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="378" y="262" fill="#ffd79a" font-family="ui-monospace,monospace" font-size="14" font-weight="700">handlers</text>
      <text x="378" y="278" fill="#8aa0bd" font-size="11.5">typed DOM event handlers — onClick(e), onInput(e), …</text>
    </g>
    <g>
      <rect x="360" y="304" width="470" height="44" rx="9" fill="#2a2113" stroke="#f6c177" stroke-opacity="0.6" stroke-width="1.3"/>
      <text x="378" y="324" fill="#ffd79a" font-family="ui-monospace,monospace" font-size="14" font-weight="700">bindableHandlers</text>
      <text x="378" y="340" fill="#8aa0bd" font-size="11.5">a signal whose value is the current listener</text>
    </g>
  </g>
</svg>
